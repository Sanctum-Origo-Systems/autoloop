name: CI
on: [push, pull_request, merge_group]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv lock --check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: Ban Path.cwd() in src/autoloop/
        run: |
          if grep -rn 'Path\.cwd()' src/autoloop/; then
            echo "::error::Path.cwd() is banned in src/autoloop/ — use the module-level REPO_DIR or a repo_dir parameter instead"
            exit 1
          fi
      - run: uv run pytest -q

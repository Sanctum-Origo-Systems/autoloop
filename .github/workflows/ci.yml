name: CI
on: [push, pull_request, merge_group]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv lock --check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
